<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Transcriber & Practice Hub</title>
    
    <!-- VexFlow and PDF Export (For Transcription) -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- OpenSheetMusicDisplay (For Practice Mode) -->
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.8/build/opensheetmusicdisplay.min.js"></script>
    
    <!-- Google Fonts: Dancing Script -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Dancing Script', cursive; text-align: center; margin-top: 20px; background-color: #fdfbf7; transition: background-color 0.4s ease; font-size: 26px;}
        h2 { color: #333; margin-bottom: 5px; font-size: 48px; font-weight: 700;}
        button, select, input, label { font-family: 'Dancing Script', cursive; font-size: 24px; font-weight: 700; }
        
        /* Master App Mode Toggle */
        .app-mode-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .master-tab { padding: 10px 20px; border-radius: 8px; border: 2px solid #333; cursor: pointer; background: transparent; color: #333; transition: 0.2s;}
        .master-tab.active { background: #333; color: white; }
        
        #menuToggle { display: none; background-color: #343a40; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; margin: 0 auto 15px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-container { display: none; flex-direction: column; align-items: center; background: rgba(255,255,255,0.7); border-radius: 12px; padding: 20px 15px; max-width: 500px; margin: 0 auto 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
        .menu-container.open { display: flex; }

        .controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; width: 100%; margin-bottom: 20px; }
        button { padding: 8px 16px; cursor: pointer; border-radius: 8px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: white; transition: 0.2s; flex-grow: 1; letter-spacing: 1px;}
        
        #startBtn { background-color: #007bff; font-size: 32px; padding: 15px 40px; display: inline-block; margin-top: 10px;}
        #uploadBtn { background-color: #17a2b8; font-size: 28px; padding: 15px 30px; display: none; margin: 20px auto;}
        
        #modeToggle { background-color: #6c757d; }
        #instrumentToggle { background-color: #17a2b8; }
        #sourceToggle { background-color: #fd7e14; }
        #clearBtn { background-color: #dc3545; }
        #pdfBtn { background-color: #6f42c1; }
        #playBtn { background-color: #28a745; } 
        #saveBtn { background-color: #20c997; }
        #loadBtn { background-color: #e83e8c; }
        
        .settings-panel { display: flex; flex-direction: column; align-items: center; width: 100%; color: #333;}
        .setting-row { width: 100%; display: flex; flex-direction: column; margin-bottom: 15px; align-items: center; }
        input[type="range"] { width: 90%; margin-top: 5px; }
        select { padding: 4px 8px; border-radius: 8px; border: 1px solid #ccc; width: 90%; background-color: #fff; cursor: pointer;}
        
        .color-section { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 15px; }
        .swatch-container { display: flex; gap: 12px; margin-top: 8px; align-items: center; justify-content: center; flex-wrap: wrap;}
        .swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.1); cursor: pointer; padding: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.15); flex-grow: 0; transition: transform 0.2s;}
        .swatch:active { transform: scale(0.9); }
        input[type="color"] { width: 40px; height: 40px; padding: 0; border: none; background: none; cursor: pointer; border-radius: 50%;}
        
        #noteDisplay { font-size: 55px; font-weight: bold; color: #000000; margin-top: 10px; transition: color 0.1s;}
        #practiceStats { font-size: 28px; color: #555; display: none; margin-top: -10px; margin-bottom: 10px; }
        
        /* Taller wrapper for the Grand Staff */
        .staff-wrapper { width: 95%; margin: 10px auto; overflow-x: auto; background: transparent; min-height: 350px; white-space: nowrap; }
        #staff { display: inline-block; padding: 10px; } 
        
        #osmdWrapper { width: 95%; margin: 10px auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none; text-align: left; }
    </style>
</head>
<body>

    <h2>Piano Transcriber</h2>
    
    <div class="app-mode-container" id="appModeContainer" style="display: none;">
        <button class="master-tab active" id="tabTranscribe">Transcription Mode</button>
        <button class="master-tab" id="tabPractice">Practice Mode</button>
    </div>

    <button id="startBtn">Start Application</button>
    
    <input type="file" id="xmlUpload" accept=".xml,.musicxml,.mxl" style="display: none;">
    <button id="uploadBtn">📂 Upload Sheet Music (.mxl / .xml / .musicxml)</button>

    <button id="menuToggle">☰ Controls & Settings</button>
    
    <div class="menu-container" id="mainMenu">
        <div class="controls">
            <button id="playBtn">▶ Play</button>
            <button id="saveBtn">💾 Save</button>
            <button id="loadBtn">📂 Load</button>
            <button id="pdfBtn">Export PDF</button>
            <button id="clearBtn">Clear Staff</button>
        </div>
        
        <div class="controls" style="margin-bottom: 10px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 15px;">
            <button id="sourceToggle">Source: Mic</button>
            <button id="modeToggle">Layout: Grid</button>
            <button id="instrumentToggle">Input: Voice</button>
        </div>

        <div class="settings-panel">
            <div class="setting-row" id="sliderContainer">
                <label for="volSlider">Mic Sensitivity: <strong id="volLabel">0.05</strong></label>
                <input type="range" id="volSlider" min="0.01" max="0.20" step="0.01" value="0.05">
            </div>
            
            <div class="setting-row">
                <label for="bpmSlider">Tempo (BPM): <strong id="bpmLabel">120</strong></label>
                <input type="range" id="bpmSlider" min="40" max="240" step="1" value="120">
            </div>
            
            <div class="setting-row">
                <label for="quantSelect">Note Specificity:</label>
                <select id="quantSelect">
                    <option value="4">Whole Note</option>
                    <option value="2">Half Note</option>
                    <option value="1">Quarter Note</option>
                    <option value="0.5">8th Note</option>
                    <option value="0.25" selected>16th Note</option>
                </select>
            </div>

            <div class="setting-row">
                <label for="keySelect">Key Signature:</label>
                <select id="keySelect">
                    <option value="C" selected>C Major</option>
                    <option value="G">G Major</option>
                    <option value="D">D Major</option>
                    <option value="A">A Major</option>
                    <option value="E">E Major</option>
                    <option value="B">B Major</option>
                    <option value="F">F Major</option>
                    <option value="Bb">Bb Major</option>
                    <option value="Eb">Eb Major</option>
                    <option value="Ab">Ab Major</option>
                    <option value="Db">Db Major</option>
                </select>
            </div>

            <div class="color-section">
                <label>Paper Color</label>
                <div class="swatch-container">
                    <button class="swatch bg-swatch" style="background-color: #fdfbf7;" data-color="#fdfbf7"></button>
                    <button class="swatch bg-swatch" style="background-color: #e3ebd6;" data-color="#e3ebd6"></button>
                    <button class="swatch bg-swatch" style="background-color: #e1e6f2;" data-color="#e1e6f2"></button>
                    <button class="swatch bg-swatch" style="background-color: #f2e1e1;" data-color="#f2e1e1"></button>
                    <input type="color" id="bgColorPicker" value="#fdfbf7">
                </div>
            </div>

            <div class="color-section">
                <label>Ink Color</label>
                <div class="swatch-container">
                    <button class="swatch ink-swatch" style="background-color: #000000;" data-color="#000000"></button>
                    <button class="swatch ink-swatch" style="background-color: #3b2f2f;" data-color="#3b2f2f"></button>
                    <button class="swatch ink-swatch" style="background-color: #1a2a40;" data-color="#1a2a40"></button>
                    <button class="swatch ink-swatch" style="background-color: #4a1c1c;" data-color="#4a1c1c"></button>
                    <input type="color" id="inkColorPicker" value="#000000">
                </div>
            </div>
        </div>
    </div>
    
    <div id="noteDisplay">--</div>
    <div id="practiceStats">Accuracy: 100% | Mistakes: 0</div>
    
    <div class="staff-wrapper" id="staffWrapper">
        <div id="staff"></div>
    </div>

    <div id="osmdWrapper"></div>

    <script>
        let audioContext, analyser, microphone;
        const VF = Vex.Flow;
        
        let isPracticeMode = false; 
        let osmd = null; 
        
        let correctHits = 0;
        let mistakesMade = 0;
        
        const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const notesFlat  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
        const keySignatures = { "C": [], "G": ["F#"], "D": ["F#", "C#"], "A": ["F#", "C#", "G#"], "E": ["F#", "C#", "G#", "D#"], "B": ["F#", "C#", "G#", "D#", "A#"], "F": ["Bb"], "Bb": ["Bb", "Eb"], "Eb": ["Bb", "Eb", "Ab"], "Ab": ["Bb", "Eb", "Ab", "Db"], "Db": ["Bb", "Eb", "Ab", "Db", "Gb"] };
        
        let layoutMode = 'page'; 
        let isVoiceMode = true; 
        let inputSource = 'mic'; 
        let volumeThreshold = 0.05;
        let targetBPM = 120;
        let minDurationBeats = 0.25; 
        let currentKey = "C";
        let currentNoteStrings = notesSharp;
        let inkColor = "#000000"; 
        
        let notesHistory = [];
        let activeNoteName = ""; 
        let activeNoteStartTime = 0;
        let activeNoteIndex = -1;
        
        // --- STRIKE BUCKET FOR LEGATO FIX ---
        let activeMidiNotes = new Set(); 
        let strikeNotes = new Set();     
        let strikeTimer = null;
        
        let frameCounter = 0; 
        let pitchBuffer = []; 
        let silenceFrames = 0; 
        const NOTES_PER_LINE = 8, LINES_PER_PAGE = 3;

        // XML Math Auto-Scaler for broken uncompressed files
        function autoScaleXML(xmlString) {
            try {
                let parser = new DOMParser(); let xmlDoc = parser.parseFromString(xmlString, "text/xml");
                let divisionsElements = xmlDoc.getElementsByTagName("divisions");
                if (divisionsElements.length > 0) {
                    let oldDivisions = parseFloat(divisionsElements[0].textContent);
                    let targetDivisions = 4; let scalingFactor = targetDivisions / oldDivisions;
                    for (let i = 0; i < divisionsElements.length; i++) divisionsElements[i].textContent = targetDivisions.toString();
                    let durationElements = xmlDoc.getElementsByTagName("duration");
                    for (let i = 0; i < durationElements.length; i++) {
                        let oldDur = parseFloat(durationElements[i].textContent);
                        let newDur = Math.max(1, Math.round(oldDur * scalingFactor));
                        durationElements[i].textContent = newDur.toString();
                    }
                }
                return new XMLSerializer().serializeToString(xmlDoc);
            } catch (e) { return xmlString; }
        }

        function preparePracticeUI() {
            isPracticeMode = true;
            document.getElementById('tabPractice').classList.add('active');
            document.getElementById('tabTranscribe').classList.remove('active');
            document.getElementById('menuToggle').style.display = 'none';
            document.getElementById('mainMenu').classList.remove('open');
            document.getElementById('staffWrapper').style.display = 'none';
            document.getElementById('uploadBtn').style.display = 'block';
            document.getElementById('osmdWrapper').style.display = 'block';
            document.getElementById('practiceStats').style.display = 'block';
            
            if (!osmd) { osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmdWrapper", { autoResize: true, drawTitle: true, followCursor: true }); }
        }

        document.getElementById('tabTranscribe').addEventListener('click', () => {
            isPracticeMode = false;
            document.getElementById('tabTranscribe').classList.add('active');
            document.getElementById('tabPractice').classList.remove('active');
            document.getElementById('menuToggle').style.display = 'block';
            document.getElementById('staffWrapper').style.display = 'block';
            document.getElementById('uploadBtn').style.display = 'none';
            document.getElementById('osmdWrapper').style.display = 'none';
            document.getElementById('practiceStats').style.display = 'none';
            document.getElementById('noteDisplay').innerText = "Transcription Ready";
            document.getElementById('noteDisplay').style.color = inkColor;
        });

        document.getElementById('tabPractice').addEventListener('click', () => {
            preparePracticeUI(); resetScore();
            document.getElementById('noteDisplay').innerText = "Upload a score to begin"; document.getElementById('noteDisplay').style.color = inkColor;
        });

        function resetScore() { correctHits = 0; mistakesMade = 0; updateScoreUI(); }

        function updateScoreUI() {
            let totalAttempts = correctHits + mistakesMade;
            let accuracy = totalAttempts === 0 ? 100 : Math.round((correctHits / totalAttempts) * 100);
            document.getElementById('practiceStats').innerText = `Accuracy: ${accuracy}% | Mistakes: ${mistakesMade}`;
        }

        function skipRests() {
            if (!osmd || !osmd.cursor) return;
            while (!osmd.cursor.Iterator.EndReached) {
                let nextEntries = osmd.cursor.Iterator.CurrentVoiceEntries; let isPlayableNote = false;
                if (nextEntries) {
                    for (let entry of nextEntries) {
                        if (entry && entry.Notes) { for (let n of entry.Notes) { if (n.Pitch) isPlayableNote = true; } }
                    }
                }
                if (isPlayableNote) break; 
                osmd.cursor.next(); 
            }
        }

        document.getElementById('uploadBtn').addEventListener('click', () => { document.getElementById('xmlUpload').click(); });

        document.getElementById('xmlUpload').addEventListener('change', (e) => {
            let file = e.target.files[0]; if (!file) return;
            preparePracticeUI(); document.getElementById('noteDisplay').innerText = "Unpacking score..."; document.getElementById('noteDisplay').style.color = inkColor;

            if (file.name.toLowerCase().endsWith('.mxl')) {
                // Correct Binary Reader for .mxl Zip Files
                let reader = new FileReader();
                reader.onload = function(event) {
                    setTimeout(() => {
                        osmd.load(event.target.result).then(function() {
                            osmd.render(); osmd.cursor.show(); resetScore(); skipRests(); 
                            document.getElementById('noteDisplay').innerText = "Play the blue note!";
                        }).catch(err => {
                            document.getElementById('noteDisplay').innerText = "Error loading .mxl file!"; document.getElementById('noteDisplay').style.color = "#dc3545";
                        });
                    }, 50);
                };
                reader.readAsBinaryString(file);
            } else {
                let reader = new FileReader();
                reader.onload = function(event) {
                    let cleanXML = event.target.result.replace(/^\uFEFF/, '').trim();
                    let scaledXML = autoScaleXML(cleanXML);
                    setTimeout(() => {
                        osmd.load(scaledXML).then(function() {
                            osmd.render(); osmd.cursor.show(); resetScore(); skipRests(); 
                            document.getElementById('noteDisplay').innerText = "Play the blue note!";
                        }).catch(err => {
                            document.getElementById('noteDisplay').innerText = "Error loading .xml file!"; document.getElementById('noteDisplay').style.color = "#dc3545";
                        });
                    }, 50);
                };
                reader.readAsText(file); 
            }
        });

        function handlePracticeMidi(midiNote) {
            if (!osmd || !osmd.cursor || osmd.cursor.hidden) return;
            if (osmd.cursor.Iterator.EndReached) return; 

            let currentVoiceEntries = osmd.cursor.Iterator.CurrentVoiceEntries;
            if (!currentVoiceEntries || currentVoiceEntries.length === 0) return;

            let expectedNotes = [];
            for (let entry of currentVoiceEntries) {
                if (entry && entry.Notes) {
                    for (let note of entry.Notes) { if (note.Pitch) expectedNotes.push(note.Pitch.getHalfTone() + 12); }
                }
            }

            if (expectedNotes.includes(midiNote)) {
                correctHits++; updateScoreUI();
                let oldText = document.getElementById('noteDisplay').innerText; document.getElementById('noteDisplay').innerText = "Perfect!"; document.getElementById('noteDisplay').style.color = "#28a745";
                setTimeout(() => { if(document.getElementById('noteDisplay').innerText === "Perfect!") { document.getElementById('noteDisplay').style.color = inkColor; document.getElementById('noteDisplay').innerText = oldText; } }, 300);
                osmd.cursor.next(); skipRests();

                if (osmd.cursor.Iterator.EndReached) {
                    let totalAttempts = correctHits + mistakesMade; let finalAccuracy = totalAttempts === 0 ? 100 : Math.round((correctHits / totalAttempts) * 100);
                    document.getElementById('noteDisplay').innerText = `Song Complete! Grade: ${finalAccuracy}%`; document.getElementById('noteDisplay').style.color = inkColor;
                }
            } else {
                mistakesMade++; updateScoreUI();
                let oldText = document.getElementById('noteDisplay').innerText; document.getElementById('noteDisplay').innerText = "Oops!"; document.getElementById('noteDisplay').style.color = "#dc3545";
                setTimeout(() => { if(document.getElementById('noteDisplay').innerText === "Oops!") { document.getElementById('noteDisplay').style.color = inkColor; document.getElementById('noteDisplay').innerText = oldText; } }, 300);
            }
        }

        function applyInkColor(context) { context.setFillStyle(inkColor); context.setStrokeStyle(inkColor); }

        // --- Grand Staff Drawing Engine ---
        function drawEmptyStaff() {
            const staffDiv = document.getElementById("staff"); staffDiv.innerHTML = "";
            const renderer = new VF.Renderer(staffDiv, VF.Renderer.Backends.SVG);
            renderer.resize(200, 250); 
            const context = renderer.getContext(); applyInkColor(context);
            
            const topStave = new VF.Stave(10, 40, 150).addClef("treble").addKeySignature(currentKey).setContext(context).draw();
            const bottomStave = new VF.Stave(10, 140, 150).addClef("bass").addKeySignature(currentKey).setContext(context).draw();
            
            new VF.StaveConnector(topStave, bottomStave).setType(3).setContext(context).draw(); 
            new VF.StaveConnector(topStave, bottomStave).setType(1).setContext(context).draw(); 
        }
        drawEmptyStaff();

        // --- Legato Overlap Fix Logic ---
        function getMIDIMessage(midiMessage) {
            if (inputSource !== 'midi') return;
            
            let command = midiMessage.data[0];
            let note = midiMessage.data[1];
            let velocity = (midiMessage.data.length > 2) ? midiMessage.data[2] : 0;
            
            if (command >= 144 && command <= 159 && velocity > 0) {
                if (isPracticeMode) {
                    handlePracticeMidi(note); 
                } else {
                    activeMidiNotes.add(note);
                    strikeNotes.add(note); 
                    
                    if (!strikeTimer) {
                        strikeTimer = setTimeout(() => {
                            let notesArray = Array.from(strikeNotes).sort((a, b) => a - b);
                            registerNotesAndDraw(notesArray);
                            strikeNotes.clear(); 
                            strikeTimer = null;
                        }, 40); 
                    }
                }
            }
            
            if (!isPracticeMode) {
                if ((command >= 128 && command <= 143) || (command >= 144 && command <= 159 && velocity === 0)) {
                    activeMidiNotes.delete(note);
                    if (activeMidiNotes.size === 0) activeNoteName = ""; 
                }
            }
        }

        document.getElementById('menuToggle').addEventListener('click', () => { document.getElementById('mainMenu').classList.toggle('open'); });

        document.querySelectorAll('.bg-swatch').forEach(btn => {
            btn.addEventListener('click', (e) => { let color = e.target.getAttribute('data-color'); document.body.style.backgroundColor = color; document.getElementById('bgColorPicker').value = color; });
        });
        document.getElementById('bgColorPicker').addEventListener('input', (e) => { document.body.style.backgroundColor = e.target.value; });

        document.querySelectorAll('.ink-swatch').forEach(btn => {
            btn.addEventListener('click', (e) => { inkColor = e.target.getAttribute('data-color'); document.getElementById('noteDisplay').style.color = inkColor; renderStaff(); });
        });
        document.getElementById('inkColorPicker').addEventListener('input', (e) => { inkColor = e.target.value; document.getElementById('noteDisplay').style.color = inkColor; renderStaff(); });

        document.getElementById('keySelect').addEventListener('change', (e) => { currentKey = e.target.value; let flatKeys = ["F", "Bb", "Eb", "Ab", "Db"]; currentNoteStrings = flatKeys.includes(currentKey) ? notesFlat : notesSharp; document.getElementById('clearBtn').click(); });
        document.getElementById('bpmSlider').addEventListener('input', (e) => { targetBPM = parseInt(e.target.value); document.getElementById('bpmLabel').innerText = targetBPM; });
        document.getElementById('quantSelect').addEventListener('change', (e) => { minDurationBeats = parseFloat(e.target.value); });
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            notesHistory = []; activeNoteName = ""; activeNoteIndex = -1; activeMidiNotes.clear(); pitchBuffer = []; 
            document.getElementById("staff").innerHTML = ""; drawEmptyStaff(); document.getElementById('noteDisplay').innerText = "--";
        });

        document.getElementById('modeToggle').addEventListener('click', (e) => {
            if (layoutMode === 'page') { layoutMode = 'scroll'; e.target.innerText = "Layout: Scroll"; e.target.style.backgroundColor = "#ffc107"; e.target.style.color = "#000";
            } else if (layoutMode === 'scroll') { layoutMode = 'single'; e.target.innerText = "Layout: Single"; e.target.style.backgroundColor = "#28a745"; e.target.style.color = "#fff";
            } else { layoutMode = 'page'; e.target.innerText = "Layout: Grid"; e.target.style.backgroundColor = "#6c757d"; e.target.style.color = "#fff"; }
            document.getElementById('clearBtn').click(); 
        });

        document.getElementById('instrumentToggle').addEventListener('click', (e) => { isVoiceMode = !isVoiceMode; e.target.innerText = isVoiceMode ? "Input: Voice" : "Input: Piano"; e.target.style.backgroundColor = isVoiceMode ? "#17a2b8" : "#e83e8c"; pitchBuffer = []; });

        document.getElementById('sourceToggle').addEventListener('click', async (e) => {
            if (inputSource === 'mic') {
                try {
                    const midiAccess = await navigator.requestMIDIAccess();
                    if (midiAccess.inputs.size === 0) { alert("Browser has permission, but sees 0 keyboards! Check your OTG adapter, phone OTG settings, and ensure the piano is on."); return; } 
                    else {
                        let deviceNames = [];
                        for (let input of midiAccess.inputs.values()) { deviceNames.push(input.name || "Unknown Keyboard"); input.onmidimessage = getMIDIMessage; }
                        alert("Success! Connected to: " + deviceNames.join(", "));
                    }
                    inputSource = 'midi'; e.target.innerText = "Source: MIDI"; e.target.style.backgroundColor = "#8e44ad"; 
                    document.getElementById('sliderContainer').style.display = 'none'; document.getElementById('instrumentToggle').style.display = 'none';
                } catch (err) { alert("MIDI could not be accessed."); }
            } else {
                inputSource = 'mic'; e.target.innerText = "Source: Mic"; e.target.style.backgroundColor = "#fd7e14"; 
                document.getElementById('sliderContainer').style.display = 'flex'; document.getElementById('instrumentToggle').style.display = 'inline-block';
            }
            document.getElementById('clearBtn').click();
        });

        document.getElementById('volSlider').addEventListener('input', (e) => { volumeThreshold = parseFloat(e.target.value); document.getElementById('volLabel').innerText = volumeThreshold.toFixed(2); });
        document.getElementById('pdfBtn').addEventListener('click', () => { const element = document.getElementById('staff'); const opt = { margin: 0.5, filename: 'piano-transcription.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' } }; html2pdf().set(opt).from(element).save(); });

        document.getElementById('saveBtn').addEventListener('click', () => {
            if(notesHistory.length === 0) { alert("The staff is empty! Play some notes before saving."); return; }
            const saveData = { notes: notesHistory, key: currentKey, bpm: targetBPM, ink: inkColor, bg: document.body.style.backgroundColor };
            localStorage.setItem('pianoAppSaveData', JSON.stringify(saveData));
            const btn = document.getElementById('saveBtn'); btn.innerText = "✓ Saved!"; setTimeout(() => btn.innerText = "💾 Save", 2000);
        });

        document.getElementById('loadBtn').addEventListener('click', () => {
            const savedString = localStorage.getItem('pianoAppSaveData');
            if (savedString) {
                const data = JSON.parse(savedString);
                notesHistory = data.notes; currentKey = data.key; targetBPM = data.bpm; inkColor = data.ink; document.body.style.backgroundColor = data.bg || '#fdfbf7';
                document.getElementById('keySelect').value = currentKey; document.getElementById('bpmSlider').value = targetBPM; document.getElementById('bpmLabel').innerText = targetBPM;
                document.getElementById('inkColorPicker').value = inkColor; document.getElementById('noteDisplay').style.color = inkColor;
                let flatKeys = ["F", "Bb", "Eb", "Ab", "Db"]; currentNoteStrings = flatKeys.includes(currentKey) ? notesFlat : notesSharp;
                activeNoteName = ""; activeNoteIndex = -1; activeMidiNotes.clear(); renderStaff();
                const btn = document.getElementById('loadBtn'); btn.innerText = "✓ Loaded!"; setTimeout(() => btn.innerText = "📂 Load", 2000);
            } else { alert("No saved song found on this device."); }
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            if (notesHistory.length === 0) return; if (audioContext.state === 'suspended') audioContext.resume();
            let now = audioContext.currentTime + 0.1; const beatDuration = 60 / targetBPM; const durMap = { "w": 4, "h": 2, "q": 1, "8": 0.5, "16": 0.25 };
            notesHistory.forEach(noteObj => {
                let beats = durMap[noteObj.duration] || 1; let durationSeconds = beats * beatDuration;
                noteObj.midiNotes.forEach(midiNum => {
                    let freq = 440 * Math.pow(2, (midiNum - 69) / 12); let osc = audioContext.createOscillator(); let gain = audioContext.createGain();
                    osc.type = 'triangle'; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + durationSeconds - 0.02); 
                    osc.connect(gain); gain.connect(audioContext.destination); osc.start(now); osc.stop(now + durationSeconds);
                });
                now += durationSeconds;
            });
        });

        function calculateVexFlowDuration(elapsedBeats) {
            const allowed = [4, 2, 1, 0.5, 0.25].filter(b => b >= minDurationBeats); if (allowed.length === 0) allowed.push(minDurationBeats);
            let closest = allowed[0]; let minDiff = Math.abs(elapsedBeats - closest);
            for(let i = 1; i < allowed.length; i++) { let diff = Math.abs(elapsedBeats - allowed[i]); if(diff < minDiff) { minDiff = diff; closest = allowed[i]; } }
            if (closest === 4) return "w"; if (closest === 2) return "h"; if (closest === 1) return "q"; if (closest === 0.5) return "8"; if (closest === 0.25) return "16"; return "q"; 
        }

        function getAccidental(noteName, key) {
            let baseLetter = noteName[0]; let isSharp = noteName.includes("#"); let isFlat = noteName.includes("b"); let noteAccidental = isSharp ? "#" : (isFlat ? "b" : "n");
            let sigMatch = keySignatures[key].find(n => n.startsWith(baseLetter)); let sigAccidental = sigMatch ? (sigMatch.includes("#") ? "#" : "b") : "n";
            if (noteAccidental !== sigAccidental) return noteAccidental; return null; 
        }

        // --- Splits Notes into Treble and Bass Hands ---
        function registerNotesAndDraw(notesArray) {
            let validNotes = notesArray.filter(n => n >= 21 && n <= 108); if (validNotes.length === 0) return;
            
            let trebleKeys = [], bassKeys = [];
            let trebleAcc = [], bassAcc = [];
            let displayNames = [];
            
            validNotes.forEach(note => {
                let noteName = currentNoteStrings[note % 12]; let octave = Math.floor(note / 12) - 1; 
                displayNames.push(noteName + octave);
                let vfKey = noteName.toLowerCase() + "/" + octave;
                let acc = getAccidental(noteName, currentKey);
                
                if (note >= 60) { trebleKeys.push(vfKey); trebleAcc.push(acc); } 
                else { bassKeys.push(vfKey); bassAcc.push(acc); }
            });
            
            let isTrebleRest = trebleKeys.length === 0; let isBassRest = bassKeys.length === 0;
            if (isTrebleRest) trebleKeys = ["b/4"]; if (isBassRest) bassKeys = ["d/3"];
            
            document.getElementById('noteDisplay').innerText = displayNames.join(" + "); 
            let chordID = validNotes.join("|"); 
                
            if (activeNoteName !== chordID) {
                activeNoteName = chordID; activeNoteStartTime = Date.now();
                let initialDur = calculateVexFlowDuration(0); 
                
                let newNoteData = { trebleKeys, bassKeys, trebleAcc, bassAcc, isTrebleRest, isBassRest, duration: initialDur, midiNotes: validNotes };
                if (layoutMode === 'single') { notesHistory = [newNoteData]; } else { notesHistory.push(newNoteData); }
                activeNoteIndex = notesHistory.length - 1; renderStaff();
            } else {
                let elapsedMs = Date.now() - activeNoteStartTime; let beatsElapsed = elapsedMs * (targetBPM / 60000); let newDur = calculateVexFlowDuration(beatsElapsed);
                if (notesHistory[activeNoteIndex].duration !== newDur) { notesHistory[activeNoteIndex].duration = newDur; renderStaff(); }
            }
        }

        // --- VexFlow Formatting for 2 Voices Simultaneously ---
        function renderStaff() {
            if (notesHistory.length === 0) return;
            const staffDiv = document.getElementById("staff"); staffDiv.innerHTML = ""; 
            
            if (layoutMode === 'single') {
                const renderer = new VF.Renderer(staffDiv, VF.Renderer.Backends.SVG); renderer.resize(200, 250); const context = renderer.getContext(); applyInkColor(context);
                
                const topStave = new VF.Stave(10, 40, 150).addClef("treble").addKeySignature(currentKey).setContext(context).draw();
                const bottomStave = new VF.Stave(10, 140, 150).addClef("bass").addKeySignature(currentKey).setContext(context).draw();
                new VF.StaveConnector(topStave, bottomStave).setType(3).setContext(context).draw();
                new VF.StaveConnector(topStave, bottomStave).setType(1).setContext(context).draw();
                
                let data = notesHistory[0]; 
                
                let tNote = new VF.StaveNote({ keys: data.trebleKeys, duration: data.isTrebleRest ? data.duration + "r" : data.duration, clef: "treble" }).setStyle({fillStyle: inkColor, strokeStyle: inkColor});
                if(!data.isTrebleRest) data.trebleAcc.forEach((acc, idx) => { if (acc) tNote.addModifier(new VF.Accidental(acc), idx); });
                
                let bNote = new VF.StaveNote({ keys: data.bassKeys, duration: data.isBassRest ? data.duration + "r" : data.duration, clef: "bass" }).setStyle({fillStyle: inkColor, strokeStyle: inkColor});
                if(!data.isBassRest) data.bassAcc.forEach((acc, idx) => { if (acc) bNote.addModifier(new VF.Accidental(acc), idx); });

                const tVoice = new VF.Voice({ num_beats: 1, beat_value: 4 }).setStrict(false).addTickables([tNote]); 
                const bVoice = new VF.Voice({ num_beats: 1, beat_value: 4 }).setStrict(false).addTickables([bNote]); 
                
                new VF.Formatter().joinVoices([tVoice, bVoice]).format([tVoice, bVoice], 100); 
                tVoice.draw(context, topStave); bVoice.draw(context, bottomStave);
                
            } else if (layoutMode === 'scroll') {
                let dynamicWidth = Math.max(300, notesHistory.length * 55 + 50); const renderer = new VF.Renderer(staffDiv, VF.Renderer.Backends.SVG); renderer.resize(dynamicWidth, 250); const context = renderer.getContext(); applyInkColor(context);
                
                const topStave = new VF.Stave(10, 40, dynamicWidth - 20).addClef("treble").addKeySignature(currentKey).setContext(context).draw();
                const bottomStave = new VF.Stave(10, 140, dynamicWidth - 20).addClef("bass").addKeySignature(currentKey).setContext(context).draw();
                new VF.StaveConnector(topStave, bottomStave).setType(3).setContext(context).draw();
                new VF.StaveConnector(topStave, bottomStave).setType(1).setContext(context).draw();

                let tNotes = [], bNotes = [];
                notesHistory.forEach(data => {
                    let tN = new VF.StaveNote({ keys: data.trebleKeys, duration: data.isTrebleRest ? data.duration + "r" : data.duration, clef: "treble" }).setStyle({fillStyle: inkColor, strokeStyle: inkColor});
                    if(!data.isTrebleRest) data.trebleAcc.forEach((acc, idx) => { if (acc) tN.addModifier(new VF.Accidental(acc), idx); }); tNotes.push(tN);
                    
                    let bN = new VF.StaveNote({ keys: data.bassKeys, duration: data.isBassRest ? data.duration + "r" : data.duration, clef: "bass" }).setStyle({fillStyle: inkColor, strokeStyle: inkColor});
                    if(!data.isBassRest) data.bassAcc.forEach((acc, idx) => { if (acc) bN.addModifier(new VF.Accidental(acc), idx); }); bNotes.push(bN);
                });

                const tVoice = new VF.Voice({ num_beats: tNotes.length, beat_value: 4 }).setStrict(false).addTickables(tNotes); 
                const bVoice = new VF.Voice({ num_beats: bNotes.length, beat_value: 4 }).setStrict(false).addTickables(bNotes); 
                new VF.Formatter().joinVoices([tVoice, bVoice]).format([tVoice, bVoice], dynamicWidth - 80); 
                tVoice.draw(context, topStave); bVoice.draw(context, bottomStave);
                const wrapper = document.getElementById("staffWrapper"); wrapper.scrollLeft = wrapper.scrollWidth;
                
            } else {
                let renderHistory = [...notesHistory]; if (renderHistory.length > NOTES_PER_LINE * LINES_PER_PAGE) { renderHistory = [ renderHistory[renderHistory.length - 1] ]; notesHistory = renderHistory; activeNoteIndex = 0; }
                const renderer = new VF.Renderer(staffDiv, VF.Renderer.Backends.SVG); renderer.resize(400, LINES_PER_PAGE * 200 + 40); const context = renderer.getContext(); applyInkColor(context);
                
                for (let i = 0; i < LINES_PER_PAGE; i++) {
                    let startIndex = i * NOTES_PER_LINE; if (startIndex >= renderHistory.length) break;
                    let lineNotesData = renderHistory.slice(startIndex, startIndex + NOTES_PER_LINE); let yOffset = i * 200;
                    
                    const topStave = new VF.Stave(10, 40 + yOffset, 350).addClef("treble").addKeySignature(currentKey).setContext(context).draw();
                    const bottomStave = new VF.Stave(10, 140 + yOffset, 350).addClef("bass").addKeySignature(currentKey).setContext(context).draw();
                    new VF.StaveConnector(topStave, bottomStave).setType(3).setContext(context).draw();
                    new VF.StaveConnector(topStave, bottomStave).setType(1).setContext(context).draw();
                    
                    let tNotes = [], bNotes = [];
                    lineNotesData.forEach(data => {
                        let tN = new VF.StaveNote({ keys: data.trebleKeys, duration: data.isTrebleRest ? data.duration + "r" : data.duration, clef: "treble" }).setStyle({fillStyle: inkColor, strokeStyle: inkColor});
                        if(!data.isTrebleRest) data.trebleAcc.forEach((acc, idx) => { if (acc) tN.addModifier(new VF.Accidental(acc), idx); }); tNotes.push(tN);
                        
                        let bN = new VF.StaveNote({ keys: data.bassKeys, duration: data.isBassRest ? data.duration + "r" : data.duration, clef: "bass" }).setStyle({fillStyle: inkColor, strokeStyle: inkColor});
                        if(!data.isBassRest) data.bassAcc.forEach((acc, idx) => { if (acc) bN.addModifier(new VF.Accidental(acc), idx); }); bNotes.push(bN);
                    });

                    const tVoice = new VF.Voice({ num_beats: tNotes.length, beat_value: 4 }).setStrict(false).addTickables(tNotes); 
                    const bVoice = new VF.Voice({ num_beats: bNotes.length, beat_value: 4 }).setStrict(false).addTickables(bNotes); 
                    new VF.Formatter().joinVoices([tVoice, bVoice]).format([tVoice, bVoice], 300); 
                    tVoice.draw(context, topStave); bVoice.draw(context, bottomStave);
                }
            }
        }

        function noteFromPitch(frequency) { return Math.round(12 * (Math.log(frequency / 440) / Math.log(2))) + 69; }

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length; let rms = 0; for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i]; rms = Math.sqrt(rms / SIZE);
            if (rms < volumeThreshold) return -1; 
            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            buf = buf.slice(r1, r2); SIZE = buf.length;
            let c = new Array(SIZE).fill(0); for (let i = 0; i < SIZE; i++) { for (let j = 0; j < SIZE - i; j++) c[i] = c[i] + buf[j] * buf[j + i]; }
            let d = 0; while (c[d] > c[d + 1]) d++; let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) { if (c[i] > maxval) { maxval = c[i]; maxpos = i; } }
            return sampleRate / maxpos;
        }

        function updatePitch() {
            requestAnimationFrame(updatePitch);
            if (inputSource === 'midi' || isPracticeMode) return; 
            frameCounter++; if (frameCounter % 2 !== 0) return;
            let buffer = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(buffer);
            let sum = 0; for(let i=0; i<buffer.length; i++) sum += buffer[i]*buffer[i]; let volume = Math.sqrt(sum/buffer.length);
            if (volume > volumeThreshold) {
                silenceFrames = 0; let frequency = autoCorrelate(buffer, audioContext.sampleRate);
                if (frequency !== -1) {
                    let note = noteFromPitch(frequency);
                    if (isVoiceMode) {
                        pitchBuffer.push(note); if (pitchBuffer.length > 5) pitchBuffer.shift(); 
                        if (pitchBuffer.length === 5 && pitchBuffer.every(val => val === pitchBuffer[0])) registerNotesAndDraw([note]); 
                    } else { registerNotesAndDraw([note]); }
                }
            } else {
                silenceFrames++; let requiredSilence = isVoiceMode ? 8 : 3; 
                if (silenceFrames > requiredSilence) { activeNoteName = ""; document.getElementById('noteDisplay').style.color = inkColor; pitchBuffer = []; }
            }
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            audioContext = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioContext.createAnalyser(); analyser.fftSize = 2048; 
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); microphone = audioContext.createMediaStreamSource(stream); microphone.connect(analyser); updatePitch(); 
                document.getElementById('startBtn').style.display = 'none'; document.getElementById('appModeContainer').style.display = 'flex';
                document.getElementById('menuToggle').style.display = 'block'; document.getElementById('mainMenu').classList.add('open');
            } catch (err) { alert('Microphone access denied or not found.'); }
        });
    </script>
</body>
